<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071525">
<title>Pemindai QR Generus — e-PRESENSI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071525;color:#eff8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123c5b 0,#071525 58%);padding:18px}.wrap{max-width:640px;margin:0 auto}.brand{display:flex;align-items:center;gap:12px;margin:6px 0 16px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#50e3ee,#3986ff);color:#06243a;font-size:25px;font-weight:900;box-shadow:0 8px 28px #36c8e433}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#72dce8;font-weight:800}.brand h1{font-size:19px;margin:3px 0 0}.card{border:1px solid #7dc9e533;background:#0c2035dd;border-radius:22px;padding:16px;box-shadow:0 20px 65px #0005}.reader{overflow:hidden;border-radius:16px;min-height:220px;background:#030b14;border:1px solid #70c8e355}.reader video{width:100%!important;max-height:72vh!important;object-fit:cover!important}.status{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;padding:12px 13px;border-radius:12px;background:#06172a;border:1px solid #6bc5e533;color:#d5e9f8;font-size:13px;line-height:1.5;min-height:44px}.help{font-size:11px;color:#91aec4;line-height:1.5;margin:12px 2px 0}.fallback{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#06172a}.fallback input{width:100%;padding:12px;border-radius:10px;border:1px solid #75bde477;background:#06172a;color:white;font-size:15px}.fallback button{margin-top:8px;width:100%;padding:12px;border:0;border-radius:10px;background:#53dce8;color:#06243a;font-weight:900}@media(max-width:480px){body{padding:10px}.card{padding:10px}.brand h1{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
 <header class="brand"><div class="logo">▦</div><div><div class="eyebrow">PPG · e-Presensi Pengajian</div><h1>Pemindai QR Generus</h1></div></header>
 <main class="card">
  <div id="reader" class="reader" aria-label="Kamera pemindai QR"></div>
  <div id="status" class="status" role="status" aria-live="polite">Menyiapkan kamera…</div>
  <section id="fallback" class="fallback"><label for="manualValue">Jika kamera tidak dapat digunakan, masukkan ID QR secara manual.</label><input id="manualValue" autocomplete="off" placeholder="ID generus atau isi QR"><button id="sendManual" type="button">Kirim untuk verifikasi</button></section>
  <p class="help">Setelah QR terbaca, periksa foto dan identitas di tab e-PRESENSI. Setelah kehadiran dicatat atau dibatalkan, kamera akan aktif kembali untuk generus berikutnya.</p>
 </main>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
 'use strict';
 var params=new URLSearchParams(location.search),token=params.get('ppgQrToken')||'',parentOrigin=params.get('ppgParentOrigin')||'';
 function validParentOrigin(value){try{var u=new URL(value);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'));}catch(e){return false;}}
 if(!validParentOrigin(parentOrigin)){try{var ref=new URL(document.referrer);if(validParentOrigin(ref.origin))parentOrigin=ref.origin;}catch(e){}}
 var scanner=null,busy=false,starting=false;
 var status=document.getElementById('status'),reader=document.getElementById('reader'),fallback=document.getElementById('fallback');
 function say(text){if(status)status.textContent=text;}
 function stopCamera(){var old=scanner;scanner=null;if(old){try{var p=old.stop();if(p&&p.catch)p.catch(function(){});}catch(e){}try{old.clear();}catch(e){}}if(reader)reader.innerHTML='';}
 function sendValue(value){value=String(value||'').trim();if(!value||busy)return;busy=true;stopCamera();if(!window.opener||window.opener.closed||!parentOrigin||!token){if(fallback)fallback.style.display='block';var input=document.getElementById('manualValue');if(input)input.value=value;say('QR terbaca, tetapi tab aplikasi utama tidak terhubung. Buka pemindai dari tombol Scan QR Code pada e-PRESENSI.');busy=false;return;}say('QR terbaca. Silakan periksa identitas di tab e-PRESENSI…');try{window.opener.postMessage({type:'PPG_QR_SCANNED',token:token,value:value},parentOrigin);}catch(e){if(fallback)fallback.style.display='block';var input=document.getElementById('manualValue');if(input)input.value=value;say('Hasil QR belum dapat dikirim ke aplikasi utama. Buka kembali pemindai dari tombol Scan QR Code.');busy=false;}}
 function startCamera(){if(scanner||starting||busy)return;if(!window.isSecureContext){say('Kamera memerlukan halaman HTTPS.');if(fallback)fallback.style.display='block';return;}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Browser ini tidak menyediakan akses kamera. Periksa browser atau masukkan ID secara manual.');if(fallback)fallback.style.display='block';return;}if(typeof Html5Qrcode==='undefined'){say('Pustaka QR belum dimuat. Periksa koneksi internet lalu muat ulang.');if(fallback)fallback.style.display='block';return;}starting=true;scanner=new Html5Qrcode('reader',{verbose:false});say('Meminta izin kamera… izinkan kamera jika browser bertanya.');scanner.start({facingMode:'environment'},{fps:10,qrbox:function(w,h){var side=Math.floor(Math.min(w,h)*.76);return {width:side,height:side};},aspectRatio:1.0},function(text){sendValue(text);},function(){}).then(function(){starting=false;if(!busy)say('Kamera aktif. Arahkan QR generus ke dalam bingkai.');}).catch(function(e){starting=false;var name=e&&e.name?e.name:'Error',msg=e&&e.message?e.message:String(e);scanner=null;say('Kamera gagal diaktifkan ('+name+'): '+msg+'\nPeriksa izin kamera situs ini, lalu muat ulang halaman.');if(fallback)fallback.style.display='block';});}
 window.addEventListener('message',function(ev){var msg=ev.data;if(ev.origin!==parentOrigin||!msg||msg.token!==token)return;if(msg.type==='PPG_QR_RESUME'){busy=false;say(msg.message||'Siap memindai QR berikutnya…');setTimeout(startCamera,350);}else if(msg.type==='PPG_QR_STOP'){busy=true;stopCamera();say('Pemindai ditutup dari aplikasi utama.');}});
 document.getElementById('sendManual').addEventListener('click',function(){sendValue(document.getElementById('manualValue').value);});
 window.addEventListener('pagehide',stopCamera);
 if(!token){say('Buka halaman ini melalui tombol Scan QR Code di aplikasi e-PRESENSI agar hasil scan dapat dikembalikan otomatis.');if(fallback)fallback.style.display='block';}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(startCamera,250);},{once:true});else setTimeout(startCamera,250);
})();
</script>
</body>
</html>
